<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10302a">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>LAST CALL 사장님</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Monoton&family=Song+Myung&family=Hahmlet:wght@400;600;700&family=VT323&display=swap">
<style>
/* Owner console: a POS-style table map. Tiles = tables, colour = state, coupons served right on the tile. */
:root{
  --felt:#10302a; --brass:#caa452; --brass-dim:#8a6d2c; --cream:#f1e8d2;
  --ink:#efe6cf; --glow:#ffd77a; --danger:#ff9a8a; --ok:#9fd39a;
  --s-free:#5f9a6a; --s-play:#caa452; --s-prize:#e04650; --s-done:#8a8573;
  --f-display:"Monoton","Song Myung",Georgia,serif;   /* neon-tube sign; Korean falls through to a Ming-style serif */
  --f-body:"Hahmlet","Apple SD Gothic Neo","Noto Serif KR",serif;
  --f-num:"VT323",ui-monospace,Menlo,monospace;   /* LED counter digits */
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{min-height:100%}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,#1d4a40 0%,transparent 60%),var(--felt);color:var(--ink);
  font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(26px,6vw,36px);letter-spacing:.06em;color:var(--glow);text-shadow:0 0 12px rgba(255,200,90,.4)}
.head-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.live{font-size:13px;color:#b9a679;display:inline-flex;align-items:center;gap:6px}
.live::before{content:"";width:9px;height:9px;border-radius:50%;background:#8a7a58}
.live.on{color:var(--ok)}.live.on::before{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.live.off{color:var(--danger)}.live.off::before{background:var(--danger)}
.mute-banner{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 16px;border:0;border-radius:14px;cursor:pointer;text-align:left;
  font:15px var(--f-body);color:#fff3dc;background:#8f1d27;box-shadow:0 0 0 2px #e04650,0 6px 18px rgba(0,0,0,.35);animation:nudge 2.4s ease-in-out infinite}
.mute-banner svg{width:26px;height:26px;flex:none}
.mute-banner b{font-size:16px}
@keyframes nudge{0%,100%{box-shadow:0 0 0 2px #e04650,0 6px 18px rgba(0,0,0,.35)}50%{box-shadow:0 0 0 5px rgba(224,70,80,.55),0 6px 18px rgba(0,0,0,.35)}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi{background:#0c0805;border-radius:12px;padding:8px 6px;text-align:center;box-shadow:inset 0 0 0 1px #3c2b10}
.kpi b{display:block;font:600 28px var(--f-num);color:#ffcf6a;font-variant-numeric:tabular-nums}
.kpi small{font-size:12px;color:#a98d55}
.kpi.hot b{color:#ff8a6a}
.card{border-radius:20px;padding:22px;display:grid;gap:14px;background:linear-gradient(180deg,#2c1f0d,#1a1206);box-shadow:0 0 0 2px var(--brass-dim),0 20px 60px rgba(0,0,0,.4)}
.card h2{margin:0;font-size:20px;color:#fff1cc}
.card h3{margin:6px 0 0;font-size:13px;letter-spacing:.16em;color:#d8bf86;font-weight:400}
.card p{margin:0;color:#ead9b2}
.narrow{max-width:520px;width:100%;margin:0 auto}
.btn{min-height:50px;border-radius:25px;border:0;cursor:pointer;font:700 16px var(--f-body);padding:0 20px;
  background:linear-gradient(180deg,#e7c873,#a8842f);color:#2c1d05;box-shadow:0 3px 0 #5d4512}
.btn.primary{background:radial-gradient(ellipse at 50% 30%,#e04650,#8f1d27 75%);color:#fff3dc;box-shadow:0 4px 0 #4f0d13,0 0 0 2px var(--brass)}
.btn.ghost{background:transparent;color:#e1c27c;box-shadow:inset 0 0 0 1px #6b5222}
.btn.small{min-height:40px;font-size:14px;padding:0 14px}
.btn:active{transform:translateY(2px)}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #9fd8ff;outline-offset:3px}
.err{min-height:1.4em;color:var(--danger) !important;font-size:14px}
.ok{color:var(--ok) !important;font-size:14px}
.field{display:grid;gap:6px;font-size:14px;color:#d8bf86}
.field input{min-width:0;height:48px;border-radius:12px;border:1px solid #5a4318;background:#120c04;color:#fff1cc;font:17px var(--f-body);padding:0 12px}
.topic{font:600 17px var(--f-num);color:var(--glow);word-break:break-all;background:#120c04;border-radius:12px;padding:12px 14px;box-shadow:inset 0 0 0 1px #4a3713;user-select:all}
ol.how{margin:0;padding-left:20px;color:#ead9b2;display:grid;gap:4px}
.note{font-size:13px;color:#a99772 !important}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1 1 160px}

/* table map */
.tables{display:grid;gap:14px;align-items:start;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.tile{background:var(--cream);color:#2a1d0a;border-radius:16px;padding:14px 16px 16px;display:grid;gap:10px;align-content:start;
  box-shadow:0 8px 22px rgba(0,0,0,.35);border-top:8px solid var(--s-free);min-height:190px}
.tile.playing{border-top-color:var(--s-play)}
.tile.prize{border-top-color:var(--s-prize)}
.tile.done{border-top-color:var(--s-done)}
.tile.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 6px rgba(255,215,122,.95)}100%{box-shadow:0 8px 22px rgba(0,0,0,.35)}}
.t-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.t-no{font:700 30px var(--f-body);letter-spacing:-.01em}
.t-no small{font-size:15px;font-weight:400;color:#6b5a3a;margin-left:2px}
.pill{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;color:#fff}
.pill.free{background:var(--s-free)}.pill.playing{background:#a8842f}.pill.prize{background:var(--s-prize)}.pill.done{background:var(--s-done)}
.t-who{font-size:17px;font-weight:700}
.t-meta{font:500 13px var(--f-num);color:#6b5a3a}
.t-empty{color:#6b5a3a;font-size:14px}
.t-rows{display:grid;gap:10px}
.t-rows:empty{display:none}
.prize-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;border-top:1px dashed #cdbf9e;padding-top:8px}
.prize-row b{font-size:16px}
.prize-row code{font:600 15px var(--f-num);color:#8f1d27}
.prize-row button{min-height:40px;border-radius:20px;border:0;padding:0 14px;font:700 14px var(--f-body);cursor:pointer;background:#8f1d27;color:#fff3dc}
.prize-row.served b,.prize-row.served code{text-decoration:line-through;color:#9a8c6c}
.prize-row.served button{background:#d9ccad;color:#5a4a2a}
.prize-row button:disabled{opacity:.6;cursor:default}
.reset{margin-top:auto;min-height:42px;border-radius:21px;border:1.5px solid #b9a679;background:transparent;color:#5a4a2a;font:700 14px var(--f-body);cursor:pointer}
.reset.arm{background:#5a4a2a;color:#fff3dc;border-color:#5a4a2a}
.orphans{display:grid;gap:8px}
.orphan{background:var(--cream);color:#2a1d0a;border-radius:12px;padding:10px 14px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar .btn{flex:0 0 auto}
.bar a{color:#e1c27c}

/* PIN pad */
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(5,16,13,.85);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.overlay .card{width:min(380px,100%);text-align:center}
.pin-dots{display:flex;gap:14px;justify-content:center}
.pin-dots i{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--brass)}
.pin-dots i.on{background:var(--glow)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keypad button{height:60px;border-radius:14px;border:0;cursor:pointer;font:600 24px var(--f-num);color:#ffe6a8;background:#120c04;box-shadow:inset 0 0 0 1px #4a3713}
.keypad .muted{font:600 15px var(--f-body);color:#c7ad78}
@media (max-width:560px){.kpi b{font-size:22px}.tables{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
/* type system: Monoton (neon sign) · Song Myung (Korean headlines) · Hahmlet (text) · VT323 (LED digits) */
header h1{letter-spacing:.02em}
.card h2,.t-no,.t-who{font-family:"Song Myung",var(--f-body);font-weight:400}
.kpi b{font-weight:400;font-size:36px;line-height:1.05}
.kpi small,.card h3{font-family:"Song Myung",var(--f-body)}
.t-meta{font-weight:400;font-size:17px}
.prize-row code{font-weight:400;font-size:20px}
.topic{font-weight:400;font-size:21px}
.keypad button{font-weight:400;font-size:30px}
@media (max-width:560px){.kpi b{font-size:28px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>LAST CALL</h1>
    <div class="head-right">
      <span class="live" id="live">연결 중…</span>
    </div>
  </header>

  <!-- shown whenever the alert sound can't play (browsers need one tap per page open) -->
  <button class="mute-banner" id="soundBtn" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
    <span><b>알림음이 꺼져 있어요</b> · 여기를 눌러 켜 주세요. 켜야 입장·당첨 때 소리가 나요.</span>
  </button>

  <!-- first run: enter the admin key from the sheet -->
  <section class="card narrow" id="setup" hidden>
    <h2>처음 설정</h2>
    <p>구글 시트 <b>'LAST CALL 슬롯 관리'</b>의 <b>설정</b> 탭에서 <b>'사장님 화면 열기'</b> 링크를 이 기기로 눌러 주세요. 바로 연결돼요.</p>
    <p class="note">링크를 쓸 수 없으면 같은 탭의 관리키를 아래에 직접 입력해도 돼요.</p>
    <label class="field">관리키<input id="keyInput" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <p class="err" id="keyErr" aria-live="assertive"></p>
    <button class="btn primary" id="keyBtn">연결하기</button>
    <p class="note" id="apiNote"></p>
  </section>

  <!-- main -->
  <main id="main" hidden>
    <div class="wrap">
      <div class="kpis">
        <div class="kpi hot"><b id="kPending">0</b><small>지급 대기</small></div>
        <div class="kpi"><b id="kPlaying">0</b><small>게임 중</small></div>
        <div class="kpi"><b id="kVisits">0</b><small>오늘 입장</small></div>
        <div class="kpi"><b id="kPrizes">0</b><small>오늘 경품</small></div>
      </div>
      <div class="tables" id="tables"></div>
      <section class="card" id="orphanBox" hidden>
        <h2>다른 지급 대기 쿠폰</h2>
        <p class="note">테이블을 비운 뒤에도 아직 지급하지 않은 쿠폰이에요.</p>
        <div class="orphans" id="orphans"></div>
      </section>
      <div class="bar">
        <button class="btn ghost" id="resetAll">전체 테이블 비우기</button>
        <button class="btn ghost" id="openSettings">설정</button>
        <a href="stickers.html" target="_blank" rel="noopener">테이블 QR 스티커 인쇄</a>
      </div>
    </div>
  </main>

  <!-- settings -->
  <section class="card narrow" id="settings" hidden></section>
</div>

<!-- PIN pad (settings only) -->
<div class="overlay" id="pinModal" hidden>
  <div class="card">
    <h2 id="pinTitle">설정</h2>
    <p id="pinHint">설정 PIN 4자리를 눌러 주세요.</p>
    <div class="pin-dots" id="pinDots"><i></i><i></i><i></i><i></i></div>
    <p class="err" id="pinErr" aria-live="assertive"></p>
    <div class="keypad" id="keypad"></div>
  </div>
</div>

<script src="config.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const API = String(window.LASTCALL_API || '').trim();
  const PRIZE_IDS = ['seven','bar','bell','cilantro'];
  const PRIZE_LABEL = { seven:'세븐 ×3', bar:'골드 바 ×3', bell:'벨 ×3', cilantro:'고수 ×3' };
  const CLS = { '게임 가능':'free', '게임 중':'playing', '경품 대기':'prize', '참여 완료':'done' };
  const POLL_MS = 4000;

  // ---------- this device ----------
  const KEY = 'lastcall-owner-v2';
  let S = {};
  try { S = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch { S = {}; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };

  // ---------- sheet API ----------
  async function apiGet(params){ const u = new URL(API); Object.keys(params).forEach(k => u.searchParams.set(k, params[k])); const r = await fetch(u); return r.json(); }
  async function apiPost(body){ const r = await fetch(API, { method:'POST', body: JSON.stringify(Object.assign({ key: S.key }, body)) }); return r.json(); }

  // ---------- first run ----------
  function showSetup(msg){
    $('main').hidden = true; $('settings').hidden = true; $('setup').hidden = false;
    $('keyErr').textContent = msg || '';
    $('apiNote').textContent = API ? '' : '아직 시트 연결 주소(config.js)가 비어 있어요. 배포 주소를 넣은 뒤 다시 열어 주세요.';
    $('keyBtn').disabled = !API;
  }
  $('keyBtn').onclick = async () => {
    const k = $('keyInput').value.trim(); if (!k) return;
    $('keyBtn').disabled = true; $('keyBtn').textContent = '연결하는 중…'; $('keyErr').textContent = '';
    try {
      const r = await apiGet({ action:'state', key:k });
      if (!r.ok) { $('keyErr').textContent = '관리키가 맞지 않아요. 시트의 설정 탭을 다시 확인해 주세요.'; return; }
      S.key = k; save(); showMain(); render(r);
    } catch { $('keyErr').textContent = '시트에 연결하지 못했어요. 인터넷과 배포 설정을 확인해 주세요.'; }
    finally { $('keyBtn').disabled = false; $('keyBtn').textContent = '연결하기'; }
  };

  // ---------- polling ----------
  let state = null, timer = null, seen = null, failCount = 0;
  async function refresh(){
    try {
      const r = await apiGet({ action:'state', key:S.key });
      if (!r.ok) { if (/관리키/.test(r.error || '')) { stop(); delete S.key; save(); return showSetup('관리키가 바뀌었어요. 다시 입력해 주세요.'); } throw new Error(r.error); }
      failCount = 0; $('live').className = 'live on'; $('live').textContent = '실시간 연결됨';
      cueChanges(r); render(r);
    } catch {
      if (++failCount >= 2) { $('live').className = 'live off'; $('live').textContent = '연결 끊김 · 인터넷 확인'; }
    }
  }
  function start(){ stop(); refresh(); timer = setInterval(refresh, POLL_MS); }
  function stop(){ clearInterval(timer); timer = null; }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.key && !$('main').hidden) { refresh(); keepAwake(); } });

  // ---------- render ----------
  const hhmm = t => t ? new Date(t).toLocaleTimeString('ko-KR', { hour:'numeric', minute:'2-digit' }) : '';
  const startOfToday = () => { const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); };
  let armed = null;   // two-tap confirm for resets: {id, until}
  // What the owner just pressed shows at once, before the sheet answers (it takes a few seconds),
  // and a poll that started earlier can't flip it back. Each intent ends when the sheet agrees or after 15 s.
  const intents = { coupons:{}, tables:{} };
  function applyIntents(r){
    const now = Date.now();
    const coupons = r.coupons.map(c => {
      const i = intents.coupons[c.code]; if (!i) return c;
      if (!i.busy && (c.served === i.served || now - i.at > 15000)) { delete intents.coupons[c.code]; return c; }
      return Object.assign({}, c, { served: i.served, busy: i.busy });
    });
    const tables = r.tables.map(t => {
      const i = intents.tables[t.no]; if (!i) return t;
      if (!i.busy && (t.status === '게임 가능' || now - i.at > 15000)) { delete intents.tables[t.no]; return t; }
      return Object.assign({}, t, { status:'게임 가능', name:'', session:'', spins:0, busy: i.busy });
    });
    return Object.assign({}, r, { coupons, tables });
  }
  // Replace only the cards whose content changed; untouched cards (and their buttons) stay the same DOM nodes.
  const htmlOf = new WeakMap();
  function patch(box, items){
    [...box.children].forEach(el => { if (!el.dataset.key) el.remove(); });   // drop the loading placeholder
    const old = new Map([...box.children].map(el => [el.dataset.key, el]));
    let prev = null;
    items.forEach(({ key, html }) => {
      let el = old.get(key);
      if (!el || htmlOf.get(el) !== html) {
        const tmp = document.createElement('div'); tmp.innerHTML = html.trim();
        const fresh = tmp.firstElementChild; fresh.dataset.key = key; htmlOf.set(fresh, html);
        if (el) el.replaceWith(fresh);
        el = fresh;
      }
      const want = prev ? prev.nextElementSibling : box.firstElementChild;
      if (el !== want) box.insertBefore(el, want);
      old.delete(key); prev = el;
    });
    old.forEach(el => el.remove());
  }
  let lastSig = '';
  function render(raw){
    if (!raw) return;
    state = raw;
    const r = applyIntents(raw);
    // rebuild the tiles only when something changed, so a button never swaps out from under a finger
    const allArmed = armed && armed.id === 'all' && armed.until > Date.now();
    const sig = JSON.stringify([r.tables, r.coupons, r.entriesToday, armed && armed.until > Date.now() ? armed.id : '']);
    if (sig === lastSig) return;   // (patch() below still keeps unchanged cards untouched)
    lastSig = sig;
    const curSessions = new Set(r.tables.map(t => t.session).filter(Boolean));
    const pend = r.coupons.filter(c => !c.served);
    $('kPending').textContent = pend.length;
    $('kPlaying').textContent = r.tables.filter(t => t.status === '게임 중').length;
    $('kVisits').textContent = r.entriesToday;
    $('kPrizes').textContent = r.coupons.filter(c => c.time >= startOfToday()).length;
    const row = c => `<div class="prize-row ${c.served ? 'served' : ''}"><b>${esc(c.prize)}</b><code>#${esc(c.code)}</code><button data-code="${esc(c.code)}" data-undo="${c.served ? 1 : ''}" ${c.busy ? 'disabled' : ''}>${c.busy ? '처리 중…' : c.served ? '취소' : '지급'}</button></div>`;
    patch($('tables'), r.tables.map(t => {
      const cls = CLS[t.status] || 'free';
      const isArmed = armed && armed.id === t.no && armed.until > Date.now();
      return { key: 't' + t.no, html: `<article class="tile ${cls}" data-no="${esc(t.no)}">
        <div class="t-head"><span class="t-no">${esc(t.no)}<small>번</small></span><span class="pill ${cls}">${esc(t.status)}</span></div>
        ${t.status === '게임 가능' ? '<div class="t-empty">손님이 QR을 찍으면 바로 시작돼요.</div>'
          : `<div class="t-who">${esc(t.name)}</div><div class="t-meta">${hhmm(t.started)} 입장 · <span class="t-spins"></span>번 돌림</div>`}
        <div class="t-rows"></div>
        ${t.status !== '게임 가능' ? `<button class="reset ${isArmed ? 'arm' : ''}" data-reset="${esc(t.no)}">${isArmed ? '한 번 더 누르면 비워요' : '새 손님 받기 (테이블 비우기)'}</button>` : ''}
      </article>` };
    }));
    // inside each card: coupon rows are patched one by one, the spin counter is plain text,
    // so pressing one coupon never rebuilds the card (or the other coupons) around the finger
    r.tables.forEach(t => {
      const tile = document.querySelector(`.tile[data-no="${CSS.escape(String(t.no))}"]`); if (!tile) return;
      const sp = tile.querySelector('.t-spins'); if (sp) sp.textContent = t.spins || 0;
      const rows = tile.querySelector('.t-rows');
      if (rows) patch(rows, r.coupons.filter(c => t.session && c.session === t.session).map(c => ({ key: 'c' + c.code, html: row(c) })));
    });
    const orphans = pend.filter(c => !curSessions.has(c.session));
    $('orphanBox').hidden = !orphans.length;
    patch($('orphans'), orphans.map(c => ({ key: 'c' + c.code, html: `<div class="orphan">테이블 ${esc(c.table)} · ${esc(c.name)} · ${hhmm(c.time)}${row(c)}</div>` })));
    $('resetAll').textContent = allArmed ? '한 번 더 누르면 전체를 비워요' : '전체 테이블 비우기';
  }

  // ---------- actions ----------
  document.addEventListener('click', async e => {
    const serveBtn = e.target.closest('.prize-row button');
    if (serveBtn) {
      const code = serveBtn.dataset.code, undo = !!serveBtn.dataset.undo;
      if (intents.coupons[code] && intents.coupons[code].busy) return;
      intents.coupons[code] = { served: !undo, at: Date.now(), busy: true };
      render(state);
      const r = await apiPost({ action:'serve', code, undo }).catch(() => null);
      if (r && r.ok) { intents.coupons[code] = { served: !undo, at: Date.now(), busy: false }; render(state); return refresh(); }
      // refused: the other device may have done it a moment earlier — that's fine, not an error
      delete intents.coupons[code];
      await refresh();
      const c = state && state.coupons.find(x => x.code === code);
      if (!(c && c.served === !undo)) alertLine('지급 처리가 안 됐어요. 다시 눌러 주세요.');
      return;
    }
    const resetBtn = e.target.closest('[data-reset]');
    if (resetBtn) return armOrRun(resetBtn.dataset.reset);
  });
  $('resetAll').onclick = () => armOrRun('all');
  async function armOrRun(id){
    if (!(armed && armed.id === id && armed.until > Date.now())) { armed = { id, until: Date.now() + 3000 }; render(state); setTimeout(() => render(state), 3100); return; }
    armed = null;
    const ids = id === 'all' ? state.tables.map(t => t.no) : [id];
    ids.forEach(no => intents.tables[no] = { at: Date.now(), busy: true });
    render(state);
    const r = await apiPost({ action:'reset', table: id }).catch(() => null);
    ids.forEach(no => { if (r && r.ok) intents.tables[no] = { at: Date.now(), busy: false }; else delete intents.tables[no]; });
    if (!r || !r.ok) alertLine('테이블을 비우지 못했어요. 다시 눌러 주세요.');
    render(state); refresh();
  }
  function alertLine(t){ $('live').className = 'live off'; $('live').textContent = t; }

  // ---------- alerts: sound on new entries and prizes ----------
  let ac = null;
  function bell(freqs, gap){
    if (!ac) return;
    const t0 = ac.currentTime + .02;
    freqs.forEach((f, i) => [[1,1],[2.76,.4],[5.4,.2]].forEach(([r,a]) => {
      const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = f*r;
      const t = t0 + i*gap; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.25*a, t+.005); g.gain.exponentialRampToValueAtTime(.0001, t+1.2/(1+r*.3));
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t+1.3);
    }));
  }
  function cueChanges(r){
    const now = { sessions: new Set(r.tables.map(t => t.session).filter(Boolean)), codes: new Set(r.coupons.map(c => c.code + c.session)) };
    if (seen) {
      const newCoupons = r.coupons.filter(c => !seen.codes.has(c.code + c.session));
      const newTables = r.tables.filter(t => t.session && !seen.sessions.has(t.session));
      if (newCoupons.length) { bell([1319,1568,2093], .16); flashTables(newCoupons.map(c => c.table)); }
      else if (newTables.length) { bell([1047], 0); flashTables(newTables.map(t => t.no)); }
    }
    seen = now;
  }
  function flashTables(nos){ setTimeout(() => nos.forEach(no => document.querySelector(`.tile[data-no="${CSS.escape(String(no))}"]`)?.classList.add('flash')), 30); }
  // iOS suspends audio when the page goes to the background, so re-check whenever it comes back
  const soundReady = () => !!ac && ac.state === 'running';
  function updateSoundBanner(){ $('soundBtn').hidden = $('main').hidden || soundReady(); }
  $('soundBtn').onclick = async () => {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      await ac.resume();
      ac.onstatechange = updateSoundBanner;
      bell([1319,1568], .14);
    } catch {}
    updateSoundBanner(); keepAwake();
  };
  document.addEventListener('visibilitychange', () => setTimeout(updateSoundBanner, 300));
  let wake = null;
  async function keepAwake(){ try { if (!wake && navigator.wakeLock) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => wake = null); } } catch {} }

  // ---------- settings PIN ----------
  async function sha(text){ const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('lastcall:' + text)); return btoa(String.fromCharCode(...new Uint8Array(d))); }
  let pinResolve = null, pinBuf = '', pinMode = 'check', pinFirst = '';
  $('keypad').innerHTML = [1,2,3,4,5,6,7,8,9].map(n => `<button data-k="${n}">${n}</button>`).join('')
    + '<button class="muted" data-k="cancel">취소</button><button data-k="0">0</button><button class="muted" data-k="del">지우기</button>';
  const drawPin = () => [...$('pinDots').children].forEach((d,i) => d.classList.toggle('on', i < pinBuf.length));
  function askPin(title, mode){
    return new Promise(res => {
      pinResolve = res; pinBuf = ''; pinFirst = ''; pinMode = mode;
      $('pinTitle').textContent = title;
      $('pinHint').textContent = mode === 'set' ? '설정을 잠글 PIN 4자리를 정해 주세요.' : '설정 PIN 4자리를 눌러 주세요.';
      $('pinErr').textContent = ''; drawPin(); $('pinModal').hidden = false;
    });
  }
  const pinDone = ok => { $('pinModal').hidden = true; const r = pinResolve; pinResolve = null; r && r(ok); };
  $('keypad').addEventListener('click', async e => {
    e.stopPropagation();
    const k = e.target.closest('button')?.dataset.k; if (!k) return;
    if (k === 'cancel') return pinDone(false);
    if (k === 'del') { pinBuf = pinBuf.slice(0,-1); return drawPin(); }
    if (pinBuf.length >= 4) return;
    pinBuf += k; drawPin();
    if (pinBuf.length < 4) return;
    await new Promise(r => setTimeout(r, 120));
    if (pinMode === 'check') {
      if (await sha(pinBuf) === S.pinHash) return pinDone(true);
      $('pinErr').textContent = 'PIN이 맞지 않아요. 다시 눌러 주세요.';
    } else if (pinMode === 'set') {
      pinFirst = pinBuf; pinMode = 'confirm'; $('pinHint').textContent = '확인을 위해 한 번 더 눌러 주세요.'; $('pinErr').textContent = '';
    } else {
      if (pinBuf === pinFirst) { S.pinHash = await sha(pinBuf); save(); return pinDone(true); }
      pinMode = 'set'; $('pinHint').textContent = '설정을 잠글 PIN 4자리를 정해 주세요.'; $('pinErr').textContent = '두 번 입력한 PIN이 달라요. 다시 정해 주세요.';
    }
    pinBuf = ''; drawPin();
  });

  // ---------- settings ----------
  $('openSettings').onclick = async () => {
    const ok = S.pinHash ? await askPin('설정', 'check') : await askPin('설정 PIN 정하기', 'set');
    if (ok) renderSettings();
  };
  function renderSettings(){
    const el = $('settings'); $('main').hidden = true; el.hidden = false; updateSoundBanner();
    const p = (state && state.prizes) || {};
    el.innerHTML = `
      <h2>설정</h2>
      <h3>경품</h3>
      ${PRIZE_IDS.map(id => `<label class="field">${PRIZE_LABEL[id]}<input id="p-${id}" value="${esc(p[id] || '')}" maxlength="24"></label>`).join('')}
      <button class="btn" id="savePrizes">경품 저장</button>
      <p class="note" id="prizeMsg">저장하면 손님 화면에 바로 반영돼요. 시트의 경품 탭에서 바꿔도 돼요.</p>
      <h3>사장님 폰 알림</h3>
      <ol class="how">
        <li>사장님 폰에 <b>ntfy</b> 앱을 설치해요 (App Store / Play 스토어에서 "ntfy" 검색).</li>
        <li>앱에서 <b>+</b>를 누르고 아래 채널 이름을 그대로 입력해 구독해요.</li>
        <li>"테스트 알림 보내기"로 알림이 오는지 확인해요.</li>
      </ol>
      <div class="topic" id="topicText">${esc((state && state.topic) || '')}</div>
      <div class="row"><button class="btn ghost" id="copyTopic">채널 이름 복사</button><button class="btn" id="testBtn">테스트 알림 보내기</button></div>
      <p class="note" id="testMsg" aria-live="polite">채널 이름은 다른 곳에 공유하지 마세요.</p>
      <h3>이 기기</h3>
      <div class="row"><button class="btn ghost" id="rePin">설정 PIN 바꾸기</button><button class="btn ghost" id="logout">연결 해제</button></div>
      <p class="note">테이블은 마지막 활동 후 ${esc((state && state.resetHours) || 3)}시간이 지나면 자동으로 비워져요. 시간은 시트의 설정 탭에서 바꿀 수 있어요.</p>
      <button class="btn primary" id="back">테이블 화면으로</button>`;
    $('savePrizes').onclick = async () => {
      const prizes = {}; PRIZE_IDS.forEach(id => { const v = $('p-'+id).value.trim(); if (v) prizes[id] = v; });
      $('savePrizes').disabled = true; $('savePrizes').textContent = '저장하는 중…';
      const r = await apiPost({ action:'prizes', prizes }).catch(() => null);
      $('savePrizes').disabled = false; $('savePrizes').textContent = '경품 저장';
      $('prizeMsg').className = r && r.ok ? 'ok' : 'err';
      $('prizeMsg').textContent = r && r.ok ? '저장했어요. 손님 화면에 바로 반영돼요.' : '저장하지 못했어요. 다시 눌러 주세요.';
      if (r && r.ok && state) state.prizes = r.prizes;
    };
    $('copyTopic').onclick = async () => {
      try { await navigator.clipboard.writeText(state.topic); $('testMsg').textContent = '복사했어요.'; }
      catch { const rg = document.createRange(); rg.selectNodeContents($('topicText')); const s = getSelection(); s.removeAllRanges(); s.addRange(rg); }
    };
    $('testBtn').onclick = async () => {
      $('testMsg').className = 'note'; $('testMsg').textContent = '보내는 중…';
      $('testBtn').disabled = true;
      const r = await apiPost({ action:'test' }).catch(() => null);
      $('testBtn').disabled = false;
      $('testMsg').className = r && r.ok ? 'ok' : 'err';
      $('testMsg').textContent = r && r.ok ? '보냈어요. 폰에 알림이 왔는지 확인해 주세요.' : '보내지 못했어요. 다시 눌러 주세요.';
    };
    $('rePin').onclick = () => askPin('새 설정 PIN', 'set');
    $('logout').onclick = () => { stop(); delete S.key; save(); showSetup(); };
    $('back').onclick = showMain;
  }

  function showMain(){
    $('setup').hidden = true; $('settings').hidden = true; $('main').hidden = false; updateSoundBanner();
    if (!state) $('tables').innerHTML = '<p class="empty">테이블 불러오는 중…</p>';
    if (!timer) start();
  }

  // ---------- boot ----------
  // The sheet's '사장님 화면 열기' link carries the admin key once; keep it on this device and drop it from the address bar.
  const linkKey = new URLSearchParams(location.search).get('key');
  if (linkKey) {
    try { history.replaceState(null, '', location.pathname); } catch {}
    if (API) {
      $('main').hidden = false; $('tables').innerHTML = '<p class="empty">연결하는 중…</p>';
      apiGet({ action:'state', key: linkKey.trim() })
        .then(r => { if (r.ok) { S.key = linkKey.trim(); save(); showMain(); render(r); } else showSetup('링크의 관리키가 맞지 않아요. 시트의 설정 탭에서 링크를 다시 눌러 주세요.'); })
        .catch(() => showSetup('시트에 연결하지 못했어요. 인터넷을 확인하고 링크를 다시 눌러 주세요.'));
    } else showSetup();
  }
  else if (!API || !S.key) showSetup();
  else showMain();
})();
</script>
</body>
</html>
