<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10302a">
<meta name="robots" content="noindex">
<title>LAST CALL 사장님</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Owner console for the store iPad: one big action (make an entry QR), settings behind biometrics. */
:root{
  --felt:#10302a; --brass:#caa452; --brass-dim:#8a6d2c; --cream:#f1e8d2;
  --ink:#efe6cf; --ink-soft:#b9c2ac; --glow:#ffd77a; --danger:#ff9a8a; --ok:#9fd39a;
  --f-display:"Limelight","Didot",Georgia,serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{min-height:100%}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,#1d4a40 0%,transparent 60%),var(--felt);color:var(--ink);
  font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 40px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:18px}
.cols{display:grid;gap:18px;align-items:start}
@media (min-width:900px){.cols{grid-template-columns:minmax(0,420px) minmax(0,1fr)}}
.cols > .left{display:grid;gap:18px;min-width:0}
header{text-align:center}
header h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(30px,8vw,44px);letter-spacing:.06em;color:var(--glow);text-shadow:0 0 12px rgba(255,200,90,.45)}
header p{margin:2px 0 0;font-size:12px;letter-spacing:.24em;color:#e8c9a0}
.card{border-radius:22px;padding:24px;display:grid;gap:14px;background:linear-gradient(180deg,#2c1f0d,#1a1206);box-shadow:0 0 0 2px var(--brass-dim),0 24px 70px rgba(0,0,0,.45)}
.card h2{margin:0;font-size:21px;color:#fff1cc}
.card h3{margin:6px 0 0;font-size:13px;letter-spacing:.16em;color:#d8bf86;font-weight:400}
.card p{margin:0;color:#ead9b2}
.step{font:600 12px var(--f-num);letter-spacing:.14em;color:var(--brass)}
.btn{min-height:54px;border-radius:27px;border:0;cursor:pointer;font:700 17px var(--f-body);padding:0 22px;
  background:linear-gradient(180deg,#e7c873,#a8842f);color:#2c1d05;box-shadow:0 3px 0 #5d4512}
.btn.primary{background:radial-gradient(ellipse at 50% 30%,#e04650,#8f1d27 75%);color:#fff3dc;box-shadow:0 4px 0 #4f0d13,0 0 0 2px var(--brass)}
.btn.big{min-height:84px;border-radius:24px;font-size:22px}
.btn.ghost{background:transparent;color:#e1c27c;box-shadow:inset 0 0 0 1px #6b5222}
.btn:active{transform:translateY(2px)}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid #9fd8ff;outline-offset:3px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{min-height:1.4em;color:var(--danger) !important;font-size:14px}
.ok{color:var(--ok) !important;font-size:14px}
.field{display:grid;gap:6px;font-size:14px;color:#d8bf86}
.field input{min-width:0;height:48px;border-radius:12px;border:1px solid #5a4318;background:#120c04;color:#fff1cc;font:17px var(--f-body);padding:0 12px}
.topic{font:600 18px var(--f-num);color:var(--glow);word-break:break-all;background:#120c04;border-radius:12px;padding:12px 14px;box-shadow:inset 0 0 0 1px #4a3713;user-select:all}
ol.how{margin:0;padding-left:20px;color:#ead9b2;display:grid;gap:4px}
.note{font-size:13px;color:#a99772 !important}
/* QR */
.qrbox{background:#fff;border-radius:18px;padding:18px;display:grid;place-items:center;aspect-ratio:1;max-width:min(420px,100%);margin:0 auto;width:100%}
.qrbox svg{width:100%;height:100%;display:block}
.timer{text-align:center;font:600 34px var(--f-num);color:var(--glow);font-variant-numeric:tabular-nums}
.timer.expired{color:var(--danger)}
.prizes{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.prizes li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid rgba(202,164,82,.15);padding:6px 0;font-size:15px}
.prizes span{color:#b9a679}
/* PIN pad */
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(5,16,13,.85);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.overlay .card{width:min(400px,100%);text-align:center}
.pin-dots{display:flex;gap:14px;justify-content:center}
.pin-dots i{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--brass)}
.pin-dots i.on{background:var(--glow)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keypad button{height:62px;border-radius:14px;border:0;cursor:pointer;font:600 24px var(--f-num);color:#ffe6a8;background:#120c04;box-shadow:inset 0 0 0 1px #4a3713}
.keypad .muted{font:600 15px var(--f-body);color:#c7ad78}
/* feed */
.feed{align-content:start}
.feed-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.live{font-size:13px;color:#b9a679;display:inline-flex;align-items:center;gap:6px}
.live::before{content:"";width:9px;height:9px;border-radius:50%;background:#8a7a58}
.live.on{color:var(--ok)}.live.on::before{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.live.off{color:var(--danger)}.live.off::before{background:var(--danger)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi{background:#0c0805;border-radius:12px;padding:8px 6px;text-align:center;box-shadow:inset 0 0 0 1px #3c2b10}
.kpi b{display:block;font:600 26px var(--f-num);color:#ffcf6a;font-variant-numeric:tabular-nums}
.kpi small{font-size:12px;color:#a98d55;letter-spacing:.06em}
.kpi.hot b{color:#ff8a6a}
.tickets{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.ticket{background:var(--cream);color:#2a1d0a;border-radius:6px 6px 14px 14px;padding:12px 14px 14px;display:grid;gap:8px;position:relative;
  box-shadow:0 6px 18px rgba(0,0,0,.35);border-top:6px solid #8f1d27}
.ticket.pending{border-top-color:#e04650;animation:arrive .6s ease-out}
.ticket.playing{border-top-color:#caa452}
.ticket.closed{border-top-color:#7d8a6a;opacity:.85}
@keyframes arrive{from{transform:translateY(-6px);box-shadow:0 0 0 4px rgba(255,215,122,.9)}to{transform:none}}
.t-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.t-table{font:700 26px var(--f-body);letter-spacing:-.01em}
.t-table small{font-size:14px;font-weight:400;color:#6b5a3a;margin-left:6px}
.t-time{font:500 13px var(--f-num);color:#6b5a3a}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:#e8dcc0;color:#5a4a2a}
.pill.play{background:#f3e2a9;color:#6b4e0e}
.pill.prize{background:#f6c9c9;color:#8f1d27}
.prize-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;border-top:1px dashed #cdbf9e;padding-top:8px}
.prize-row b{font-size:16px}
.prize-row code{font:600 15px var(--f-num);color:#8f1d27}
.prize-row button{min-height:40px;border-radius:20px;border:0;padding:0 14px;font:700 14px var(--f-body);cursor:pointer;background:#8f1d27;color:#fff3dc}
.prize-row.served b,.prize-row.served code{text-decoration:line-through;color:#9a8c6c}
.prize-row.served button{background:#d9ccad;color:#5a4a2a}
.t-foot{font-size:13px;color:#6b5a3a}
.empty{color:#b9a679;font-size:15px;padding:18px 0;text-align:center;grid-column:1/-1}
details.done summary{cursor:pointer;color:#d8bf86;font-size:14px;padding:6px 0}
details.done .tickets{margin-top:10px}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>LAST CALL</h1><p>Owner Console</p></header>

  <div class="cols">
  <div class="left">
  <!-- first-run setup -->
  <section class="card" id="setup" hidden></section>

  <!-- main -->
  <section class="card" id="main" hidden>
    <h2>새 손님 입장</h2>
    <p>버튼을 누르고 얼굴이나 지문으로 확인하면 입장 QR이 나와요. 손님이 폰으로 찍으면 무료 코인 10개가 들어가요.</p>
    <button class="btn primary big" id="makeQr">입장 QR 만들기</button>
    <div id="qrArea" hidden>
      <div class="qrbox" id="qr"></div>
      <div class="timer" id="timer">2:00</div>
      <p class="note" style="text-align:center">QR은 2분 뒤 만료돼요. 한 손님 그룹에 한 번만 보여 주세요.</p>
      <button class="btn ghost" id="closeQr" style="width:100%">QR 닫기</button>
    </div>
    <h3>지금 경품</h3>
    <ul class="prizes" id="prizeList"></ul>
    <button class="btn ghost" id="openSettings">설정</button>
  </section>

  <!-- settings -->
  <section class="card" id="settings" hidden></section>
  </div>

  <!-- live feed: tickets per table, like a POS order screen -->
  <section class="card feed" id="feed" hidden>
    <div class="feed-head"><h2>실시간 알림</h2><span class="live" id="live">연결 중…</span></div>
    <div class="kpis">
      <div class="kpi hot"><b id="kPending">0</b><small>지급 대기</small></div>
      <div class="kpi"><b id="kPlaying">0</b><small>게임 중</small></div>
      <div class="kpi"><b id="kVisits">0</b><small>오늘 입장</small></div>
      <div class="kpi"><b id="kPrizes">0</b><small>오늘 경품</small></div>
    </div>
    <button class="btn ghost" id="soundBtn">알림음 켜기</button>
    <div class="tickets" id="tickets"></div>
    <details class="done" id="doneBox"><summary id="doneSum">완료 0</summary><div class="tickets" id="doneTickets"></div></details>
  </section>
  </div>
</div>

<!-- PIN pad -->
<div class="overlay" id="pinModal" hidden>
  <div class="card">
    <h2 id="pinTitle">사장님 확인</h2>
    <p id="pinHint">예비 PIN 4자리를 눌러 주세요.</p>
    <div class="pin-dots" id="pinDots"><i></i><i></i><i></i><i></i></div>
    <p class="err" id="pinErr" aria-live="assertive"></p>
    <div class="keypad" id="keypad"></div>
  </div>
</div>

<script src="vendor/qrcode.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const PRIZE_IDS = ['seven','bar','bell','cilantro'];
  const PRIZE_LABEL = { seven:'세븐 ×3', bar:'골드 바 ×3', bell:'벨 ×3', cilantro:'고수 ×3' };
  const PRIZE_DEFAULTS = { seven:'시그니처 칵테일 1잔', bar:'고량주 1병', bell:'하이볼 1잔', cilantro:'군만두' };
  const QR_SECONDS = 120;

  // ---------- storage (this iPad only) ----------
  const KEY = 'lastcall-owner-v1';
  let S = {};
  try { S = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch { S = {}; }
  S.prizes = Object.assign({}, PRIZE_DEFAULTS, S.prizes || {});
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };

  // ---------- helpers ----------
  const rand = n => crypto.getRandomValues(new Uint8Array(n));
  const b64u = bytes => btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  const unb64u = s => Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0));
  async function sha(text){ const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('lastcall:' + text)); return b64u(new Uint8Array(d)); }
  const newTopic = () => 'lastcall-' + Array.from(rand(12), b => 'abcdefghijkmnpqrstuvwxyz23456789'[b % 32]).join('');
  const hasPasskey = () => !!(window.PublicKeyCredential && navigator.credentials);

  // ---------- biometrics (passkey, verified on this device) ----------
  async function registerBiometric(){
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: rand(32),
      rp: { name: 'LAST CALL', id: location.hostname },
      user: { id: rand(16), name: 'owner', displayName: 'LAST CALL 사장님' },
      pubKeyCredParams: [{ type:'public-key', alg:-7 }, { type:'public-key', alg:-257 }],
      authenticatorSelection: { authenticatorAttachment:'platform', userVerification:'required', residentKey:'preferred' },
      timeout: 60000, attestation: 'none'
    }});
    S.credId = b64u(new Uint8Array(cred.rawId)); save();
  }
  async function checkBiometric(){
    if (!S.credId || !hasPasskey()) return false;
    try {
      const a = await navigator.credentials.get({ publicKey: {
        challenge: rand(32), rpId: location.hostname, timeout: 60000, userVerification: 'required',
        allowCredentials: [{ type:'public-key', id: unb64u(S.credId) }]
      }});
      return !!a && a.response && (new Uint8Array(a.response.authenticatorData)[32] & 0x04) !== 0; // UV flag
    } catch { return false; }
  }
  // Face ID / Touch ID first; the 4-digit backup PIN if that fails or isn't set up.
  async function authorize(title){
    if (await checkBiometric()) return true;
    return askPin(title, 'check');
  }

  // ---------- PIN pad ----------
  let pinResolve = null, pinBuf = '', pinMode = 'check', pinFirst = '';
  $('keypad').innerHTML = [1,2,3,4,5,6,7,8,9].map(n => `<button data-k="${n}">${n}</button>`).join('')
    + '<button class="muted" data-k="cancel">취소</button><button data-k="0">0</button><button class="muted" data-k="del">지우기</button>';
  const drawPin = () => [...$('pinDots').children].forEach((d,i) => d.classList.toggle('on', i < pinBuf.length));
  function askPin(title, mode){
    return new Promise(res => {
      pinResolve = res; pinBuf = ''; pinFirst = ''; pinMode = mode;
      $('pinTitle').textContent = title;
      $('pinHint').textContent = mode === 'set' ? '예비 PIN 4자리를 정해 주세요.' : '예비 PIN 4자리를 눌러 주세요.';
      $('pinErr').textContent = ''; drawPin(); $('pinModal').hidden = false;
    });
  }
  const pinDone = ok => { $('pinModal').hidden = true; const r = pinResolve; pinResolve = null; r && r(ok); };
  $('keypad').addEventListener('click', async e => {
    const k = e.target.closest('button')?.dataset.k; if (!k) return;
    if (k === 'cancel') return pinDone(false);
    if (k === 'del') { pinBuf = pinBuf.slice(0,-1); return drawPin(); }
    if (pinBuf.length >= 4) return;
    pinBuf += k; drawPin();
    if (pinBuf.length < 4) return;
    await new Promise(r => setTimeout(r, 120));
    if (pinMode === 'check') {
      if (await sha(pinBuf) === S.pinHash) return pinDone(true);
      $('pinErr').textContent = 'PIN이 맞지 않아요. 다시 눌러 주세요.';
    } else if (pinMode === 'set') {
      pinFirst = pinBuf; pinMode = 'confirm'; $('pinHint').textContent = '확인을 위해 한 번 더 눌러 주세요.'; $('pinErr').textContent = '';
    } else {
      if (pinBuf === pinFirst) { S.pinHash = await sha(pinBuf); save(); return pinDone(true); }
      pinMode = 'set'; $('pinHint').textContent = '예비 PIN 4자리를 정해 주세요.'; $('pinErr').textContent = '두 번 입력한 PIN이 달라요. 처음부터 다시 정해 주세요.';
    }
    pinBuf = ''; drawPin();
  });

  // ---------- notifications ----------
  async function testNotify(){
    const r = await fetch('https://ntfy.sh/', { method:'POST', body: JSON.stringify({ topic:S.topic, title:'LAST CALL 알림 테스트', message:'이 알림이 보이면 설정 완료예요. 손님 입장과 당첨 알림이 여기로 와요.', tags:['white_check_mark'] }) });
    if (!r.ok) throw new Error(r.status);
  }
  const ntfyHow = () => `
    <ol class="how">
      <li>사장님 폰에 <b>ntfy</b> 앱을 설치해요 (App Store / Play 스토어에서 "ntfy" 검색).</li>
      <li>앱에서 <b>+</b>를 누르고 아래 채널 이름을 그대로 입력해 구독해요. 서버는 기본값(ntfy.sh) 그대로 두세요.</li>
      <li>아래 "테스트 알림 보내기"를 눌러 폰에 알림이 오는지 확인해요.</li>
    </ol>
    <div class="topic" id="topicText">${esc(S.topic)}</div>
    <div class="row"><button class="btn ghost" id="copyTopic">채널 이름 복사</button><button class="btn" id="testBtn">테스트 알림 보내기</button></div>
    <p class="note" id="testMsg" aria-live="polite">채널 이름을 아는 사람은 알림을 볼 수 있어요. 다른 곳에 공유하지 마세요.</p>`;
  function wireNtfy(){
    $('copyTopic').onclick = async () => {
      try { await navigator.clipboard.writeText(S.topic); $('testMsg').textContent = '복사했어요.'; }
      catch { const r = document.createRange(); r.selectNodeContents($('topicText')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    };
    $('testBtn').onclick = async () => {
      $('testMsg').className = 'note'; $('testMsg').textContent = '보내는 중…';
      try { await testNotify(); $('testMsg').className = 'ok'; $('testMsg').textContent = '보냈어요. 폰에 알림이 왔는지 확인해 주세요.'; }
      catch { $('testMsg').className = 'err'; $('testMsg').textContent = '보내지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.'; }
    };
  }

  // ---------- first-run setup ----------
  function renderSetup(step){
    const el = $('setup'); $('main').hidden = true; $('settings').hidden = true; el.hidden = false;
    if (step === 1) {
      el.innerHTML = `
        <span class="step">설정 1/3</span>
        <h2>사장님 얼굴·지문 등록</h2>
        <p>입장 QR을 만들 때와 설정을 바꿀 때 Face ID나 Touch ID로 확인해요. 이 아이패드에 한 번만 등록하면 돼요.</p>
        <button class="btn primary" id="regBtn" ${hasPasskey() ? '' : 'disabled'}>Face ID / Touch ID 등록</button>
        <p class="err" id="regErr" aria-live="assertive">${hasPasskey() ? '' : '이 기기·브라우저에서는 생체인식을 쓸 수 없어요. 예비 PIN만 사용해요.'}</p>
        <button class="btn ghost" id="skipBtn">${hasPasskey() ? '나중에 하고 예비 PIN만 쓰기' : '다음'}</button>`;
      $('regBtn').onclick = async () => {
        try { await registerBiometric(); renderSetup(2); }
        catch { $('regErr').textContent = '등록하지 못했어요. 아이패드 설정에서 Face ID(또는 Touch ID)와 암호, iCloud 키체인이 켜져 있는지 확인해 주세요.'; }
      };
      $('skipBtn').onclick = () => renderSetup(2);
    } else if (step === 2) {
      el.innerHTML = `
        <span class="step">설정 2/3</span>
        <h2>예비 PIN 정하기</h2>
        <p>생체인식이 안 될 때 쓰는 4자리 숫자예요.</p>
        <button class="btn primary" id="pinBtn">예비 PIN 정하기</button>`;
      $('pinBtn').onclick = async () => { if (await askPin('예비 PIN 정하기', 'set')) renderSetup(3); };
    } else {
      if (!S.topic) { S.topic = newTopic(); save(); }
      el.innerHTML = `
        <span class="step">설정 3/3</span>
        <h2>사장님 폰으로 알림 받기</h2>
        <p>손님이 입장하거나 경품에 당첨되면 사장님 폰으로 알림이 와요.</p>
        ${ntfyHow()}
        <button class="btn primary" id="doneBtn">설정 끝내기</button>`;
      wireNtfy();
      $('doneBtn').onclick = () => { S.setupDone = true; save(); renderMain(); showFeed(); };
    }
  }

  // ---------- main: entry QR ----------
  let qrTimer = null;
  function renderMain(){
    $('setup').hidden = true; $('settings').hidden = true; $('main').hidden = false;
    $('prizeList').innerHTML = PRIZE_IDS.map(id => `<li><span>${PRIZE_LABEL[id]}</span><b>${esc(S.prizes[id])}</b></li>`).join('');
  }
  function closeQr(){ clearInterval(qrTimer); $('qrArea').hidden = true; $('qr').innerHTML = ''; $('makeQr').hidden = false; }
  $('closeQr').onclick = closeQr;
  $('makeQr').onclick = async () => {
    if (!(await authorize('입장 QR 만들기'))) return;
    const exp = Date.now() + QR_SECONDS*1000;
    const payload = { v:1, n: b64u(rand(6)), e: exp, k: S.topic, p: PRIZE_IDS.map(id => S.prizes[id]) };
    const t = b64u(new TextEncoder().encode(JSON.stringify(payload)));
    const url = new URL('./', location.href).href + '?t=' + t;
    const q = qrcode(0, 'M'); q.addData(url); q.make();
    $('qr').innerHTML = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
    $('qrArea').hidden = false; $('makeQr').hidden = true;
    const tick = () => {
      const left = Math.max(0, Math.round((exp - Date.now())/1000));
      $('timer').textContent = left ? `${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}` : '만료됨';
      $('timer').classList.toggle('expired', !left);
      if (!left) { clearInterval(qrTimer); $('qr').style.opacity = .15; setTimeout(closeQr, 2500); }
    };
    $('qr').style.opacity = 1; clearInterval(qrTimer); tick(); qrTimer = setInterval(tick, 500);
  };

  // ---------- settings ----------
  $('openSettings').onclick = async () => { if (await authorize('설정')) renderSettings(); };
  function renderSettings(){
    closeQr();
    const el = $('settings'); $('main').hidden = true; el.hidden = false;
    el.innerHTML = `
      <h2>설정</h2>
      <h3>경품</h3>
      ${PRIZE_IDS.map(id => `<label class="field">${PRIZE_LABEL[id]}<input id="p-${id}" value="${esc(S.prizes[id])}" maxlength="24"></label>`).join('')}
      <button class="btn" id="savePrizes">경품 저장</button>
      <p class="note">바꾼 경품은 다음에 만드는 입장 QR부터 적용돼요.</p>
      <h3>알림</h3>
      ${ntfyHow()}
      <h3>보안</h3>
      <button class="btn ghost" id="reReg" ${hasPasskey() ? '' : 'disabled'}>Face ID / Touch ID ${S.credId ? '다시 등록' : '등록'}</button>
      <p class="err" id="regErr" aria-live="assertive"></p>
      <button class="btn ghost" id="rePin">예비 PIN 바꾸기</button>
      <p class="note">설정과 PIN은 이 아이패드의 브라우저에만 저장돼요. 사파리 방문 기록·데이터를 지우면 처음부터 다시 설정해야 해요.</p>
      <button class="btn primary" id="back">돌아가기</button>`;
    wireNtfy();
    $('savePrizes').onclick = () => {
      PRIZE_IDS.forEach(id => { S.prizes[id] = $('p-'+id).value.trim() || PRIZE_DEFAULTS[id]; });
      save(); $('savePrizes').textContent = '저장했어요';
    };
    $('reReg').onclick = async () => {
      try { await registerBiometric(); $('regErr').className = 'ok'; $('regErr').textContent = '등록했어요.'; }
      catch { $('regErr').className = 'err'; $('regErr').textContent = '등록하지 못했어요. 기기 설정에서 Face ID(또는 Touch ID)와 iCloud 키체인을 확인해 주세요.'; }
    };
    $('rePin').onclick = () => askPin('새 예비 PIN', 'set');
    $('back').onclick = renderMain;
  }

  // ---------- live feed (ntfy server-sent events) ----------
  // Messages are the ones index.html publishes; their wording is fixed there, so parse it back here.
  const RE_ENTER = /^테이블 (\d+) · (.+?) 님이 게임을 시작했어요$/;
  const RE_PRIZE = /^테이블 (\d+) · (.+?) — (.+) 당첨 \(쿠폰 (\d{4})\)$/;
  const RE_END   = /^테이블 (\d+) · (.+?) — (\d+)번 돌림 · /;
  S.feed = Array.isArray(S.feed) ? S.feed : [];      // [{id,time,message}]
  S.served = S.served || {};                          // prize message id -> served time
  let es = null, esTopic = null, feedReady = false;
  const sameDay = (a, b) => new Date(a).toDateString() === new Date(b).toDateString();
  const hhmm = t => new Date(t).toLocaleTimeString('ko-KR', { hour:'numeric', minute:'2-digit' });

  function connectFeed(){
    if (!S.topic || (es && esTopic === S.topic)) return;
    if (es) es.close();
    esTopic = S.topic;
    if (S.feedTopic !== S.topic) { S.feed = []; S.feedTopic = S.topic; save(); }
    const since = S.feed.length ? S.feed[S.feed.length-1].id : '12h';
    es = new EventSource(`https://ntfy.sh/${encodeURIComponent(S.topic)}/sse?since=${encodeURIComponent(since)}`);
    $('live').className = 'live'; $('live').textContent = '연결 중…';
    let offTimer = null;   // brief reconnects are normal; only flag a real outage
    es.onopen = () => { clearTimeout(offTimer); $('live').className = 'live on'; $('live').textContent = '실시간 연결됨'; setTimeout(() => feedReady = true, 1500); };
    es.onerror = () => { clearTimeout(offTimer); offTimer = setTimeout(() => { $('live').className = 'live off'; $('live').textContent = '연결 끊김 · 인터넷을 확인해 주세요'; }, 6000); };
    es.onmessage = ev => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.event !== 'message' || S.feed.some(x => x.id === m.id)) return;
      S.feed.push({ id: m.id, time: m.time * 1000, message: m.message || '' });
      const cutoff = Date.now() - 3*864e5;
      S.feed = S.feed.filter(x => x.time > cutoff).slice(-800);
      save(); renderFeed();
      if (feedReady) cue(m.message || '');
    };
  }

  function buildVisits(){
    const open = {}, visits = [];
    const msgs = S.feed.slice().sort((a,b) => a.time - b.time);
    const get = (table, name, time) => {
      const key = table + '|' + name;
      if (!open[key]) { open[key] = { table, name, start: time, prizes: [], ended: false }; visits.push(open[key]); }
      return open[key];
    };
    for (const m of msgs) {
      let r;
      if ((r = RE_ENTER.exec(m.message))) {
        const key = r[1] + '|' + r[2];
        open[key] = null; get(r[1], r[2], m.time);
      } else if ((r = RE_PRIZE.exec(m.message))) {
        get(r[1], r[2], m.time).prizes.push({ name: r[3], code: r[4], time: m.time, key: m.id });
      } else if ((r = RE_END.exec(m.message))) {
        const v = get(r[1], r[2], m.time); v.ended = true; v.spins = +r[3]; v.end = m.time;
        open[r[1] + '|' + r[2]] = null;
      }
    }
    return visits;
  }

  function renderFeed(){
    const now = Date.now();
    const pendingOf = v => v.prizes.filter(p => !S.served[p.key]).length;
    const visits = buildVisits().filter(v => sameDay(v.start, now) || pendingOf(v));
    const active = visits.filter(v => pendingOf(v) || !v.ended).sort((a,b) => (pendingOf(b)>0) - (pendingOf(a)>0) || b.start - a.start);
    const done = visits.filter(v => !pendingOf(v) && v.ended).sort((a,b) => b.start - a.start);
    const today = visits.filter(v => sameDay(v.start, now));
    $('kPending').textContent = visits.reduce((a,v) => a + pendingOf(v), 0);
    $('kPlaying').textContent = visits.filter(v => !v.ended).length;
    $('kVisits').textContent = today.length;
    $('kPrizes').textContent = today.reduce((a,v) => a + v.prizes.length, 0);
    const ticket = v => {
      const pend = pendingOf(v);
      const cls = pend ? 'pending' : (v.ended ? 'closed' : 'playing');
      const pill = pend ? `<span class="pill prize">경품 ${pend}개 대기</span>` : (v.ended ? `<span class="pill">종료 · ${v.spins ?? '-'}번 돌림</span>` : '<span class="pill play">게임 중</span>');
      return `<article class="ticket ${cls}">
        <div class="t-head"><span class="t-table">테이블 ${esc(v.table)}<small>${esc(v.name)}</small></span><span class="t-time">${hhmm(v.start)}</span></div>
        <div>${pill}</div>
        ${v.prizes.map(p => `<div class="prize-row ${S.served[p.key] ? 'served' : ''}"><b>${esc(p.name)}</b><code>#${esc(p.code)}</code><button data-key="${esc(p.key)}">${S.served[p.key] ? '취소' : '지급'}</button></div>`).join('')}
        ${v.ended && !v.prizes.length ? '<div class="t-foot">당첨 없음</div>' : ''}
      </article>`;
    };
    $('tickets').innerHTML = active.length ? active.map(ticket).join('') : '<p class="empty">진행 중인 손님이 없어요. 입장 QR을 만들면 여기에 테이블별로 표시돼요.</p>';
    $('doneTickets').innerHTML = done.map(ticket).join('');
    $('doneSum').textContent = `오늘 완료 ${done.length}`;
    $('doneBox').hidden = !done.length;
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('.prize-row button'); if (!b) return;
    const k = b.dataset.key;
    if (S.served[k]) delete S.served[k]; else S.served[k] = Date.now();
    save(); renderFeed();
  });

  // ---------- alert sound + keep the screen awake ----------
  let ac = null;
  function bell(freqs, gap){
    if (!ac) return;
    const t0 = ac.currentTime + .02;
    freqs.forEach((f, i) => [[1,1],[2.76,.4],[5.4,.2]].forEach(([r,a]) => {
      const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = f*r;
      const t = t0 + i*gap; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.25*a, t+.005); g.gain.exponentialRampToValueAtTime(.0001, t+1.2/(1+r*.3));
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t+1.3);
    }));
  }
  function cue(msg){
    if (RE_PRIZE.test(msg)) { bell([1319,1568,2093], .16); document.title = '🔔 경품 당첨 · LAST CALL'; setTimeout(() => document.title = 'LAST CALL 사장님', 6000); }
    else if (RE_ENTER.test(msg)) bell([1047], 0);
  }
  $('soundBtn').onclick = () => {
    try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); bell([1319,1568], .14); $('soundBtn').hidden = true; } catch {}
    keepAwake();
  };
  let wake = null;
  async function keepAwake(){ try { if (!wake && navigator.wakeLock) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => wake = null); } } catch {} }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && ac) keepAwake(); });
  setInterval(() => { if (!$('feed').hidden) renderFeed(); }, 60000);

  function showFeed(){ $('feed').hidden = false; renderFeed(); connectFeed(); }

  // ---------- boot ----------
  if (!S.setupDone || !S.pinHash || !S.topic) renderSetup(S.pinHash ? 3 : (S.credId ? 2 : 1));
  else { renderMain(); showFeed(); }
})();
</script>
</body>
</html>
