<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>LAST CALL 테이블 QR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Monoton&family=Song+Myung&family=Hahmlet:wght@400;600;700&family=VT323&display=swap">
<style>
/* A4 sheet of table stickers: 2 × 3 cards, cut along the dashed lines. */
:root{--felt:#10302a;--brass:#caa452;--cream:#f1e8d2;--glow:#ffd77a;--ink:#2a1d0a;
  --f-display:"Monoton","Song Myung",Georgia,serif;--f-body:"Hahmlet","Apple SD Gothic Neo",serif;--f-num:"VT323",monospace}
*{box-sizing:border-box}
body{margin:0;background:#e9e4d8;color:var(--ink);font-family:var(--f-body);padding:16px}
.tools{max-width:190mm;margin:0 auto 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tools button{min-height:44px;border-radius:22px;border:0;padding:0 20px;font:700 15px var(--f-body);background:#8f1d27;color:#fff3dc;cursor:pointer}
.tools label{font-size:14px}
.tools input{width:64px;height:40px;border-radius:10px;border:1px solid #b9a679;font:16px var(--f-body);padding:0 8px}
.sheet{width:190mm;max-width:100%;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:0}
.sticker{border:1px dashed #b9a679;padding:6mm;display:grid;place-items:center;break-inside:avoid}
.card{width:100%;aspect-ratio:3/4;border-radius:5mm;background:var(--felt);color:var(--cream);display:grid;grid-template-rows:auto auto 1fr auto;
  justify-items:center;padding:6mm 6mm 5mm;box-shadow:inset 0 0 0 1.2mm var(--brass);text-align:center;gap:2mm}
.card h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:9mm;letter-spacing:.06em;color:var(--glow)}
.card .sub{font-size:3.4mm;letter-spacing:.2em;color:#e8c9a0}
.qr{background:#fff;border-radius:3mm;padding:3mm;width:52mm;max-width:100%;aspect-ratio:1;align-self:center}
.qr svg{width:100%;height:100%;display:block}
.foot{display:grid;gap:1mm}
.foot b{font:600 7mm var(--f-num);color:var(--glow)}
.foot span{font-size:3.4mm;color:#ead9b2}
@media print{
  body{background:#fff;padding:0}
  .tools{display:none}
  @page{size:A4;margin:10mm}
  .card{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
/* type system: Monoton (neon sign) · Song Myung · VT323 */
.card h1{font-size:8.4mm;letter-spacing:.02em}
.card .sub,.foot span{font-family:"Song Myung",var(--f-body)}
.foot b{font-weight:400;font-size:9mm}
</style>
</head>
<body>
<div class="tools">
  <button id="print">인쇄하기</button>
  <label>테이블 수 <input id="count" type="number" min="1" max="30" value="6"></label>
  <span>점선을 따라 잘라 테이블에 붙여 주세요.</span>
</div>
<div class="sheet" id="sheet"></div>
<script src="vendor/qrcode.js"></script>
<script>
(() => {
  const base = new URL('./', location.href).href;
  function draw(){
    const n = Math.max(1, Math.min(30, parseInt(document.getElementById('count').value, 10) || 6));
    document.getElementById('sheet').innerHTML = Array.from({ length: n }, (_, i) => {
      const q = qrcode(0, 'M'); q.addData(base + '?t=' + (i + 1)); q.make();
      return `<div class="sticker"><div class="card">
        <h1>LAST CALL</h1>
        <div class="sub">무료 칵테일 슬롯</div>
        <div class="qr">${q.createSvgTag({ cellSize: 4, margin: 0, scalable: true })}</div>
        <div class="foot"><b>TABLE ${i + 1}</b><span>카메라로 찍고 코인 10개 받기<br>테이블당 1회 · 메뉴 경품</span></div>
      </div></div>`;
    }).join('');
  }
  document.getElementById('count').addEventListener('input', draw);
  document.getElementById('print').addEventListener('click', () => window.print());
  draw();
})();
</script>
</body>
</html>
